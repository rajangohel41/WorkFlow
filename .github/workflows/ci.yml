name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run backend automated test suite
        working-directory: backend
        env:
          NODE_ENV: test
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017/workflow_test
          WORKFLOW_TEST_PORT: 5101
        run: npm test

      - name: Run frontend automated test suite
        working-directory: frontend
        run: npm test

      - name: Build frontend production bundle
        working-directory: frontend
        run: npm run build

      - name: Audit dependency security
        run: |
          npm --prefix backend audit
          npm --prefix frontend audit
